[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canopy"
version = "0.2.0"
description = "Under the Canopy: flood water hidden under forest, mapped with NISAR L-band radar"
requires-python = ">=3.11"
# Core stays numpy-only (CLAUDE.md rule 6, docs/10 D-003).
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# docs/10 D-005, D-016
dev = ["pytest>=8", "ruff>=0.5", "jsonschema>=4.20"]
# docs/10 D-004: only needed for real NISAR / reference data
real = ["h5py>=3.10", "rasterio>=1.3", "asf_search>=8", "earthaccess>=0.9", "dataretrieval>=1.0", "pyhdf>=0.11"]

[tool.setuptools]
packages = ["canopy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
