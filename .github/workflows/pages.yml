# Deploys web/ to GitHub Pages. Manual only until the owner enables Pages (CLAUDE.md rule 10).
# Uses committed web/data/ when present (real sites), otherwise builds synthetic data.
name: pages
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build synthetic data if none is committed
        run: |
          if [ ! -f web/data/manifest.json ]; then
            pip install -e pipeline
            (cd pipeline && python cli.py all --synthetic)
          fi
      - name: Strip dev-only files
        run: rm -rf web/node_modules web/tests web/test-results web/package*.json web/playwright.config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
