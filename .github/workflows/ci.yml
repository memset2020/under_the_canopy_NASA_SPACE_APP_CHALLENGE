# Runs every suite on synthetic data (docs/08). No secrets, no network beyond package installs.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e "pipeline[dev]"
      - run: ruff check pipeline && ruff format --check pipeline
      - run: pytest -q
        working-directory: pipeline

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -e pipeline
      - name: Build synthetic data (web/data-synthetic)
        run: python cli.py all --synthetic
        working-directory: pipeline
      - run: npm ci
        working-directory: web
      - run: node --test tests/unit
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/test-results
